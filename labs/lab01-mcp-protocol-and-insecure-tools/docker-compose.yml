name: mcp-lab01

services:
  lab01:
    build: .
    image: mcp-lab01

    environment:
      - MCP_SERVER
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3

    volumes:
      - ./logs:/app/logs

    user: "1000:1000"
    networks:
      - mcp-network

    # Isolation: the vulnerable server executes shell commands, so the container
    # has no network, no capabilities and a read-only filesystem.
    # Note: chat scenario needs network access to reach Ollama — omit
    # network_mode: none when using --scenario chat.
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
