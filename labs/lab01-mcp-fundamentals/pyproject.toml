[project]
name = "mcp-lab01"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

# To run the MCP Client:
#   PYTHONPATH=src uv run python3 -m app
#   OR: python3 src/app.py
#
# To run the MCP Server directly (for debugging):
#   PYTHONPATH=src uv run python3 -m mcp_server
#   OR: python3 src/mcp_server.py
#
# Note: The MCP Server is automatically started by the Client when you type /register
#       so you typically don't need to run it separately.